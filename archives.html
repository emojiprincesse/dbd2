<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>archives</title>
  <link rel="icon" href="favicon-edem.png?v=3" type="image/png">
  <link rel="shortcut icon" href="favicon-edem.png?v=3" type="image/png">
  <link rel="apple-touch-icon" href="favicon-edem.png?v=3">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/archives.css">
  <script src="js/musique.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/archives.js" defer></script>
</head>
<body class="archives-body">
  <main class="archives-page show" id="archivesPage">
<!-- Bulles décoratives -->
<div class="bubble pink"></div>
<div class="bubble gray"></div>
<div class="bubble pink"></div>
<div class="bubble gray"></div>
<div class="bubble pink"></div>
<div class="bubble gray"></div>
<div class="bubble pink"></div>
<div class="bubble gray"></div>
<div class="bubble pink"></div>
<!-- Barre supérieure -->
<div class="page-top-bar">
  <div class="page-top-bar-left">
    <span class="page-top-bar-apple"></span>
    <span class="page-top-bar-title">archives</span>
  </div>
  <span class="page-top-bar-date archives-date">22 octobre</span>
</div>
<!-- Fenêtre des archives -->
<section class="archives-window">
  <div class="archives-window-bar">
    <div class="window-dots">
      <span class="window-dot window-dot-pink"></span>
      <span class="window-dot window-dot-gray"></span>
    </div>
    <span class="archives-window-title">anniv2monAmoureux</span>
  </div>
  <!-- Dossiers -->
  <div class="archives-files">
    <button class="archive-file" type="button" data-archive="playlist2Love">
      <span class="archive-folder">
        <span class="folder-tab"></span>
        <span class="folder-body"></span>
        <span class="folder-shine"></span>
      </span>
      <span class="archive-file-label">playlist2Love</span>
    </button>
    <button class="archive-file" type="button" data-archive="cartePostale">
      <span class="archive-folder">
        <span class="folder-tab"></span>
        <span class="folder-body"></span>
        <span class="folder-shine"></span>
      </span>
      <span class="archive-file-label">cartePostale</span>
    </button>
    <button class="archive-file" type="button" data-archive="backTo2019">
      <span class="archive-folder">
        <span class="folder-tab"></span>
        <span class="folder-body"></span>
        <span class="folder-shine"></span>
      </span>
      <span class="archive-file-label">backTo2019</span>
    </button>
  </div>
</section>
  </main>
  <!-- Menu hamburger -->

<button
  class="menu-button"
  id="menuButton"
  type="button"
  aria-label="Menu"
  aria-expanded="false"
  aria-controls="menuPanel"
>
  <span></span>
  <span></span>
  <span></span>
</button>


  <!-- Contenu du menu -->
  <div class="menu-panel" id="menuPanel">
<button class="menu-item" type="button" data-page="accueil">
  accueil
</button>
<button class="menu-item" type="button" data-page="courrier">
  petit courrier
</button>
<button class="menu-item" type="button" data-page="archives">
  archives
</button>
  </div>
</body>
</html>
