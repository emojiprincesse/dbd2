<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8dce9">
  <title>playlist2Love</title>
  <link rel="stylesheet" href="css/playlist2Love.css">
  <script src="js/playlist2Love.js" defer></script>
</head>
<body>
  <!-- Bulles animées en arrière-plan -->
  <div class="bubble-background" aria-hidden="true">
    <span class="bubble bubble-1"></span>
    <span class="bubble bubble-2"></span>
    <span class="bubble bubble-3"></span>
    <span class="bubble bubble-4"></span>
    <span class="bubble bubble-5"></span>
    <span class="bubble bubble-6"></span>
    <span class="bubble bubble-7"></span>
    <span class="bubble bubble-8"></span>
    <span class="bubble bubble-9"></span>
  </div>
  <!-- Barre supérieure -->
  <header class="topbar">
    <a class="brand" href="playlist2Love.html">
      <span class="apple-logo" aria-label="Apple">&#63743;</span>
      <span>playlist2Love</span>
    </a>
    <span class="topbar-date">22 octobre</span>
  </header>
  <!-- Menu -->
  <button
    class="menu-button"
    id="menuButton"
    aria-label="Afficher le menu"
    aria-expanded="false"
    aria-controls="menuPanel"
    type="button"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
  <nav class="menu-panel" id="menuPanel" hidden>
    <a href="index.html">Accueil</a>
    <a href="courrier.html">Petit courrier</a>
    <a href="archives.html">Archives</a>
  </nav>
  <!-- Contenu principal -->
  <main class="page-content">
    <section class="hero">
      <p class="eyebrow">une petite playlist</p>
      <h1>faite avec amour <3</h1>
      <p class="hero-subtitle">rien que pour toi !</p>
    </section>
    <!-- Lecteur et playlist -->
    <section class="music-layout">
      <!-- iPod -->
      <div class="ipod-column">
        <div class="ipod">
          <div class="ipod-screen">
            <div class="screen-top">
              <span>En cours</span>
              <span class="battery-icon" aria-label="Batterie">▰</span>
            </div>
            <div class="album-art current-art" id="ipodArtwork">
              <img src="images/playlist-cover.png" alt="Pochette de l’album" />
            </div>
            <p class="ipod-track-title" id="ipodTitle">
              petit son
            </p>
            <p class="ipod-track-artist" id="ipodArtist">
              Daft Punk
            </p>
            <div class="ipod-progress">
              <span id="ipodCurrentTime">0:00</span>
              <span id="ipodDuration">0:00</span>
            </div>
            <div class="ipod-controls">
              <button
                class="icon-button"
                data-action="previous"
                aria-label="Titre précédent"
                type="button"
              >◀◀</button>
              <button
                class="icon-button main-play"
                data-action="toggle"
                aria-label="Lecture ou pause"
                type="button"
              >▶</button>
              <button
                class="icon-button"
                data-action="next"
                aria-label="Titre suivant"
                type="button"
              >▶▶</button>
            </div>
          </div>
          <!-- Molette -->
          <div class="ipod-wheel">
            <span class="wheel-menu">MENU</span>
            <button
              class="wheel-button wheel-prev"
              data-action="previous"
              aria-label="Précédent"
              type="button"
            >◀◀</button>
            <button
              class="wheel-button wheel-next"
              data-action="next"
              aria-label="Suivant"
              type="button"
            >▶▶</button>
            <button
              class="wheel-center"
              data-action="toggle"
              aria-label="Lecture ou pause"
              type="button"
            >
              <span id="wheelPlayIcon">▶</span>
            </button>
            <span class="wheel-bottom">▶Ⅱ</span>
          </div>
        </div>
      </div>
      <!-- Playlist -->
      <div class="playlist-card">
        <div class="playlist-header">
          <div>
            <span class="playlist-name">playlist2Love</span>
            <span class="track-count">· 15 titres</span>
          </div>
          <span class="music-brand">♫ Music</span>
        </div>
        <div class="track-list" id="trackList">
          <!-- Les morceaux sont générés par playlist2Love.js -->
        </div>
        <button
          class="show-all-button"
          id="showAllButton"
          type="button"
        >
          voir les 15 titres <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>
  </main>
  <!-- Lecteur fixe en bas -->
  <footer class="bottom-player">
    <div class="bottom-track">
      <div class="mini-art" id="bottomArtwork">
        <img src="images/playlist-cover.png" alt="Pochette de l’album" />
      </div>
      <div class="bottom-track-info">
        <span class="bottom-title" id="bottomTitle">
          un petit son
        </span>
        <span class="bottom-artist" id="bottomArtist">
          Daft Punk
        </span>
      </div>
    </div>
    <div class="bottom-timeline">
      <span id="bottomCurrentTime">0:00</span>
      <input
        id="seekBar"
        type="range"
        min="0"
        max="100"
        value="0"
        aria-label="Position dans la chanson"
      >
      <span id="bottomDuration">0:00</span>
    </div>
    <div class="bottom-controls">
      <button
        data-action="previous"
        aria-label="Titre précédent"
        type="button"
      >◀◀</button>
      <button
        data-action="toggle"
        id="bottomPlay"
        aria-label="Lecture ou pause"
        type="button"
      >▶</button>
      <button
        data-action="next"
        aria-label="Titre suivant"
        type="button"
      >▶▶</button>
    </div>
    <div class="volume-control">
      <span aria-hidden="true">♫</span>
      <input
        id="volumeBar"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
        aria-label="Volume"
      >
    </div>
    <div class="bottom-message">
      <span aria-hidden="true">♫</span>
      <span>la musique continue<br>avec toi ♡</span>
    </div>
  </footer>
  <!-- Lecteur audio -->
  <audio id="audioPlayer" preload="metadata"></audio>
</body>
</html>
